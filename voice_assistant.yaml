# ==============================================================================
# PROJEKT: ESP32-S3 Voice Satellite
# AUTHOR:  KRISUUUU
# GITHUB:  https://github.com/KRISUUUU/esp32-s3-voice-satellite
#
# OPIS (PL): Satelita głosowa dla Home Assistant (I2S Audio + WS2812B LED)
# DESC (EN): Voice Satellite for Home Assistant (I2S Audio + WS2812B LED)
# ==============================================================================

substitutions:
  # === KONFIGURACJA NAZWY (NAMING CONFIG) ===
  name: "esp32-s3-voice-satellite"
  friendly_name: "Asystent Głosowy"
  
  # === ID PROJEKTU (PROJECT ID) ===
  project_name: "KRISUUUU.voice-satellite"
  project_version: "0.1.1"
  
  # === PINY SPRZĘTOWE (HARDWARE PINS) ===
  i2s_bclk: GPIO15  # Zegar Bitowy / Bit Clock (BCLK)
  i2s_lrclk: GPIO16 # Zegar Słowa / Word Select (WS/LRC)
  mic_data: GPIO6   # Dane Mikrofonu / Mic Data (SD)
  amp_data: GPIO11  # Dane Wzmacniacza / Amp Data (DIN)
  led_pin: GPIO21   # Dane LED / LED Data (DI)
  num_leds: "12"    # Liczba diod / Number of LEDs

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  
  # Opis widoczny w Dashboardzie / Description in Dashboard
  comment: "Voice Satellite by KRISUUUU"
  
  project:
    name: ${project_name}
    version: ${project_version}
  min_version: 2024.12.0
  
  on_boot:
    - priority: 600
      then:
        # Startowy test LED - Tęcza / Startup Rainbow Effect
        - light.turn_on:
            id: led_ring
            brightness: 80%
            effect: "Startup Rainbow"
        - delay: 3s
        - light.turn_off: led_ring
        - light.control:
            id: led_ring
            effect: none
        # Autostart nasłuchiwania / Auto-start listening
        - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      # Optymalizacja CPU dla Audio / CPU Optimization for Audio
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_INST_CACHE_64KB: "y"
      CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE: "4096"
  flash_size: 8MB

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE # Wymagane dla stabilnego audio / Required for stable audio
  
  manual_ip:
    static_ip: 10.0.50.177
    gateway: 10.0.50.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    
  ap:
    ssid: "Asystent-Recovery"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_key
  
  on_client_connected:
    - logger.log: "Connected to Home Assistant API"
    - light.turn_on:
        id: led_ring
        brightness: 60%
        green: 100%
        effect: none
    - delay: 1s
    - light.turn_off: led_ring

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO
  baud_rate: 115200

sensor:
  - platform: wifi_signal
    name: "Siła Sygnału WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Czas Pracy"
    update_interval: 60s

switch:
  - platform: template
    name: "Mikrofon Aktywny"
    id: mic_switch
    icon: "mdi:microphone"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - micro_wake_word.start:
    turn_off_action:
      - micro_wake_word.stop:

# === SILNIK AUDIO (I2S ENGINE) ===
i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_shared
    i2s_din_pin: ${mic_data}
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit 
    sample_rate: 16000
    mclk_multiple: 256

speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_shared
    dac_type: external
    i2s_dout_pin: ${amp_data}
    channel: stereo
    bits_per_sample: 32bit
    sample_rate: 16000
    mclk_multiple: 256

# === EFEKTY LED (LED EFFECTS) ===
light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "Status LED"
    pin: ${led_pin}
    num_leds: ${num_leds}
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      # TĘCZA: Poprawna definicja dla paska adresowalnego
      - addressable_rainbow:
          name: "Startup Rainbow"
          speed: 10
          width: 360
          
      - strobe:
          name: "Flash"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 100%
              duration: 200ms
            - state: false
              duration: 100ms
              
      # SŁUCHANIE: Długi niebieski wężyk w PRAWO
      - addressable_lambda:
          name: "Listening Right"
          update_interval: 60ms
          lambda: |-
            static int step = 0;
            it.all() = Color::BLACK;
            int size = it.size();
            int pos = step % size;
            
            it[pos] = Color(0, 0, 255);
            it[(pos - 1 + size) % size] = Color(0, 0, 200);
            it[(pos - 2 + size) % size] = Color(0, 0, 150);
            it[(pos - 3 + size) % size] = Color(0, 0, 100);
            it[(pos - 4 + size) % size] = Color(0, 0, 50);
            it[(pos - 5 + size) % size] = Color(0, 0, 20);
            
            step++;

      # MYŚLENIE: Niebieskie pulsowanie diod 3 i 9
      - addressable_lambda:
          name: "Thinking Pulse"
          update_interval: 20ms
          lambda: |-
            float pulse = sin(millis() * 0.01f);
            int val = (pulse + 1.0f) * 127.0f;
            it.all() = Color::BLACK;
            it[3] = Color(0, 0, val);
            it[9] = Color(0, 0, val);

      # ODPOWIADANIE: Długi niebieski wężyk w LEWO
      - addressable_lambda:
          name: "Speaking Left"
          update_interval: 60ms
          lambda: |-
            static int step = 1200;
            it.all() = Color::BLACK;
            int size = it.size();
            int pos = step % size;
            
            it[pos] = Color(0, 0, 255);
            it[(pos + 1) % size] = Color(0, 0, 200);
            it[(pos + 2) % size] = Color(0, 0, 150);
            it[(pos + 3) % size] = Color(0, 0, 100);
            it[(pos + 4) % size] = Color(0, 0, 50);
            it[(pos + 5) % size] = Color(0, 0, 20);
            
            step--;
            if (step < 0) step = 1200;

# === WAKE WORD (OKAY NABU) ===
micro_wake_word:
  id: mww
  microphone: mic_i2s
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: wake_word_nabu
      probability_cutoff: 0.5
  
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# === LOGIKA ASYSTENTA (ASSISTANT LOGIC) ===
voice_assistant:
  id: va
  microphone: mic_i2s
  speaker: physical_speaker 
  micro_wake_word: mww
  volume_multiplier: 1.0
  
  on_listening:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Listening Right"
  
  on_stt_vad_end:
    - light.control:
        id: led_ring
        effect: "none"
    - light.turn_on:
        id: led_ring
        brightness: 80%
        effect: "Thinking Pulse"
        
  on_tts_start:
    - light.control:
        id: led_ring
        effect: "none"
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Speaking Left"
  
  on_end:
    - delay: 800ms
    - light.turn_off: led_ring
    - light.control:
        id: led_ring
        effect: none
    # Restart nasłuchiwania
    - micro_wake_word.start:
  
  on_error:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        red: 100%
        effect: none
    - delay: 2s
    - light.turn_off: led_ring
    - micro_wake_word.start:

# === PRZYCISKI STERUJĄCE (CONTROL BUTTONS) ===
button:
  - platform: restart
    name: "Restart Urządzenia"
    entity_category: config
    
  - platform: template
    name: "Uruchom Asystenta"
    icon: "mdi:account-voice"
    on_press:
      - voice_assistant.start: