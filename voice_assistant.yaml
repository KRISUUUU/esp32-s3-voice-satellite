# ==============================================================================
# PROJECT: ESP32-S3 Voice Satellite for Home Assistant (Performance Edition)
# PROJEKT: Satelita Głosowy ESP32-S3 dla Home Assistant (Wersja Wydajna)
# ==============================================================================
# DESCRIPTION: High-performance voice assistant with VAD and 16MB Flash support
# OPIS: Wysokowydajny asystent głosowy z VAD i obsługą 16MB Flash
#
# FEATURES / FUNKCJE:
# - Hardware VAD (Voice Activity Detection) for silence suppression
# - Sprzętowa detekcja mowy (VAD) do eliminacji ciszy
# - Optimized Audio Pipeline (24kHz WAV) for low latency
# - Zoptymalizowany tor audio (24kHz WAV) dla niskich opóźnień
# - Advanced LED feedback / Zaawansowana sygnalizacja LED
# - Dual I2S Bus / Podwójna magistrala I2S
#
# HARDWARE REQUIREMENTS / WYMAGANIA SPRZĘTOWE:
# - ESP32-S3 with 16MB Flash and Octal PSRAM (N16R8/N16R16)
# - I2S Microphone (INMP441)
# - I2S Amplifier (MAX98357A x2)
# - WS2812B LED Ring
#
# NETWORK / SIEĆ:
# - Static IP: 10.0.50.177
# - Gateway: 10.0.50.1
#
# SECURITY / BEZPIECZEŃSTWO:
# - Ensure 'secrets.yaml' is NOT committed to git
# - Upewnij się, że plik 'secrets.yaml' NIE jest przesyłany do git
# ==============================================================================

substitutions:
  name: "esp32-s3-voice-satellite"
  friendly_name: "Asystent Głosowy"
  project_name: "KRISUUUU.voice-satellite"
  project_version: "2.0.0" 
  
  # Hardware Pin Configuration / Konfiguracja Pinów Sprzętowych
  mic_bclk: GPIO15      # Microphone Bit Clock
  mic_lrclk: GPIO16     # Microphone Left/Right Clock
  mic_data: GPIO6       # Microphone Data
  
  amp_bclk: GPIO4       # Amplifier Bit Clock
  amp_lrclk: GPIO5      # Amplifier Left/Right Clock
  amp_data: GPIO11      # Amplifier Data
  
  led_pin: GPIO21       # WS2812B LED Strip
  num_leds: "12"        # Number of LEDs in ring

# ==============================================================================
# CORE CONFIGURATION / KONFIGURACJA PODSTAWOWA
# ==============================================================================

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.12.5
  
  on_boot:
    - priority: 600
      then:
        - script.execute: boot_sequence_smart
        
  # Custom partition table for 16MB Flash models
  # Niestandardowa tabela partycji dla modeli 16MB Flash
  platformio_options:
    board_build.partitions: https://raw.githubusercontent.com/espressif/arduino-esp32/master/tools/partitions/default_16MB.csv

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_INST_CACHE_64KB: "y"
      CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# ==============================================================================
# NETWORK CONFIGURATION / KONFIGURACJA SIECIOWA
# ==============================================================================

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  manual_ip:
    static_ip: 10.0.50.177
    gateway: 10.0.50.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
  ap:
    ssid: "Asystent-Recovery"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_key
  
  on_client_connected:
    - logger.log: "API Connected - Full Debug Active"
    - if:
        condition:
          and:
            - not: { micro_wake_word.is_running: }
            - switch.is_off: mute_switch
        then:
          - micro_wake_word.start:

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

# ==============================================================================
# LOGGING & DEBUGGING / LOGOWANIE I DIAGNOSTYKA
# ==============================================================================

logger:
  level: INFO
  baud_rate: 115200
  logs:
    i2s_audio: WARN
    sensor: WARN
    esp32_rmt_led_strip: WARN

# ==============================================================================
# AUDIO HARDWARE / SPRZĘT AUDIO
# ==============================================================================

i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: ${mic_lrclk}
    i2s_bclk_pin: ${mic_bclk}
    
  - id: i2s_amp_bus
    i2s_lrclk_pin: ${amp_lrclk}
    i2s_bclk_pin: ${amp_bclk}

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: ${mic_data}
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000
    mclk_multiple: 256

speaker:
  # Physical speaker output / Fizyczne wyjście głośnika
  - platform: i2s_audio
    id: physical_speaker_output
    i2s_audio_id: i2s_amp_bus
    dac_type: external
    i2s_dout_pin: ${amp_data}
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 24000
    mclk_multiple: 256
    buffer_duration: 500ms
    timeout: 200ms

  # Speaker mixer / Mikser głośnika
  - platform: mixer
    id: main_speaker_mixer
    output_speaker: physical_speaker_output
    source_speakers:
      - id: announcement_input
        buffer_duration: 600ms
        timeout: 10s
      - id: media_input
        buffer_duration: 1000ms
        timeout: 10s

media_player:
  - platform: speaker
    name: "Odtwarzacz Asystenta"
    id: voice_media_player
    volume_min: 0.1
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_input
      format: WAV
      sample_rate: 24000
      num_channels: 1
    media_pipeline:
      speaker: media_input
      sample_rate: 24000
      num_channels: 1

# ==============================================================================
# SENSORS / CZUJNIKI
# ==============================================================================

sensor:
  - platform: wifi_signal
    name: "Siła Sygnału WiFi"
    update_interval: 60s
    entity_category: diagnostic
    
  - platform: uptime
    name: "Czas Pracy"
    update_interval: 300s
    entity_category: diagnostic

# ==============================================================================
# CONTROLS / STEROWANIE
# ==============================================================================

switch:
  - platform: template
    name: "Wycisz Mikrofon"
    id: mute_switch
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: ALWAYS_OFF
    
    turn_on_action:
      - micro_wake_word.stop:
      - light.turn_on:
          id: led_ring
          brightness: 30%
          effect: none
          red: 100%
          green: 0%
          blue: 0%
    
    turn_off_action:
      - light.turn_off: led_ring
      - micro_wake_word.start:

button:
  - platform: restart
    name: "Restart Urządzenia"
    entity_category: config
    
  - platform: template
    name: "Uruchom Asystenta"
    icon: "mdi:account-voice"
    on_press:
      - voice_assistant.start:

# ==============================================================================
# LED EFFECTS / EFEKTY LED
# ==============================================================================

light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "Status LED"
    pin: ${led_pin}
    num_leds: ${num_leds}
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      # Boot animation / Animacja startowa
      - addressable_lambda:
          name: "Boot Filling"
          update_interval: 30ms
          lambda: |-
            static int step = 0;
            Color c = Color(0, 255, 200);
            it.all() = Color::BLACK;
            for (int i = 0; i <= step; i++) { if (i < it.size()) it[i] = c; }
            step++;
            if (step > it.size() + 2) step = 0;
            
      # Connection status / Status połączenia
      - addressable_lambda:
          name: "Connection Breathe"
          update_interval: 50ms
          lambda: |-
            float b = (sin(millis() * 0.003f) + 1.0f) / 2.0f;
            if (b < 0.1f) b = 0.1f;
            it.all() = Color(0, int(255 * b), 0);
            
      # Listening state / Stan nasłuchiwania
      - addressable_lambda:
          name: "Listening Double"
          update_interval: 60ms
          lambda: |-
            static int s = 0;
            it.all() = Color::BLACK;
            int sz = it.size();
            it[s % sz] = Color(0, 0, 255);
            it[(s - 1 + sz) % sz] = Color(0, 0, 150);
            it[(s + sz/2) % sz] = Color(0, 0, 255);
            it[(s + sz/2 - 1 + sz) % sz] = Color(0, 0, 150);
            s++; if (s >= sz) s = 0;
            
      # Thinking state / Stan myślenia
      - addressable_lambda:
          name: "Thinking Pulse"
          update_interval: 40ms
          lambda: |-
            float b = 0.2f + (0.8f * ((sin(millis() / 300.0f) + 1.0f) / 2.0f));
            it.all() = Color(0, 0, int(255 * b));
            
      # Speaking state / Stan odpowiedzi
      - addressable_lambda:
          name: "Speaking Reverse"
          update_interval: 60ms
          lambda: |-
            static int s = 0;
            it.all() = Color::BLACK;
            int sz = it.size();
            int base = sz * 100 - s;
            it[base % sz] = Color(150, 0, 255);
            it[(base + 1) % sz] = Color(100, 0, 150);
            it[(base + sz/2) % sz] = Color(150, 0, 255);
            it[(base + sz/2 + 1) % sz] = Color(100, 0, 150);
            s++;

# ==============================================================================
# BOOT SEQUENCE / SEKWENCJA STARTOWA
# ==============================================================================

script:
  - id: boot_sequence_smart
    then:
      - light.turn_on:
          id: led_ring
          brightness: 60%
          effect: "Boot Filling"
      - delay: 2s
      - light.turn_off: led_ring
      - if:
          condition: { api.connected: }
          then:
            - light.turn_on:
                id: led_ring
                brightness: 80%
                effect: "Connection Breathe"
            - delay: 1s
            - light.turn_off: led_ring
      - if:
          condition:
            and: [ not: { micro_wake_word.is_running: }, switch.is_off: mute_switch ]
          then:
            - micro_wake_word.start:

# ==============================================================================
# WAKE WORD & VAD / WYKRYWANIE SŁOWA I DETEKCJA MOWY
# ==============================================================================

micro_wake_word:
  id: mww
  microphone: mic_i2s
  vad:
    model: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/vad.json
  models:
    - model: "https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/okay_nabu.json"
      id: ww_nabu
      probability_cutoff: 0.35
  on_wake_word_detected:
    - micro_wake_word.stop:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Listening Double"
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# ==============================================================================
# VOICE ASSISTANT LOGIC / LOGIKA ASYSTENTA GŁOSOWEGO
# ==============================================================================

voice_assistant:
  id: va
  microphone: mic_i2s
  speaker: announcement_input
  micro_wake_word: mww
  
  # Listening phase / Faza nasłuchiwania
  on_listening:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Listening Double"
        
  # Processing phase / Faza przetwarzania
  on_stt_vad_end:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Thinking Pulse"
        
  # Speaking phase / Faza odpowiedzi
  on_tts_stream_start:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Speaking Reverse"
        
  # End of speech / Koniec mowy
  on_tts_stream_end:
    - delay: 200ms
    - light.turn_off: led_ring
    
  # Pipeline complete / Zakończenie pipeline
  on_end:
    - delay: 500ms
    - if:
        condition:
          and:
            - not: { micro_wake_word.is_running: }
            - switch.is_off: mute_switch
        then:
          - micro_wake_word.start:
          
  # Error handling / Obsługa błędów
  on_error:
    - logger.log: "⚠️ VOICE ERROR - RESTARTING LISTENER"
    - light.turn_on:
        id: led_ring
        brightness: 100%
        red: 100%
        green: 0%
        blue: 0%
    - delay: 1s
    - light.turn_off: led_ring
    - if:
        condition:
          and:
            - not: { micro_wake_word.is_running: }
            - switch.is_off: mute_switch
        then:
          - micro_wake_word.start: