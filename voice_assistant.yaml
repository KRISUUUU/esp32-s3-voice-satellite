# ==============================================================================
# PROJECT: ESP32-S3 Voice Satellite for Home Assistant
# PROJEKT: Satelita Głosowy ESP32-S3 dla Home Assistant
# ==============================================================================
# DESCRIPTION: High-performance voice assistant node with LED feedback
# OPIS: Wysokowydajny węzeł asystenta głosowego z informacją zwrotną LED
#
# FEATURES / FUNKCJE:
# - Multi-model wake word detection (Alexa, Nabu, Jarvis)
# - Visual LED feedback for all voice assistant states
# - I2S microphone and speaker support
# - Mixer for simultaneous announcement and media playback
# - Low latency audio processing with PSRAM
#
# HARDWARE REQUIREMENTS / WYMAGANIA SPRZĘTOWE:
# - ESP32-S3 with 8MB Flash and Octal PSRAM
# - I2S Microphone (INMP441 or similar)
# - I2S Amplifier (MAX98357A or similar)
# - WS2812B LED Ring (12 LEDs)
#
# NETWORK CONFIGURATION / KONFIGURACJA SIECIOWA:
# - Static IP: 10.0.50.177 (Change in 'wifi' section if needed)
# - Statyczny IP: 10.0.50.177 (Zmień w sekcji 'wifi' w razie potrzeby)
# - Gateway: 10.0.50.1
# - DNS: 8.8.8.8
#
# SECURITY / BEZPIECZEŃSTWO:
# - Ensure 'secrets.yaml' is NOT committed to git
# - Upewnij się, że plik 'secrets.yaml' NIE jest przesyłany do git
# ==============================================================================

substitutions:
  name: "esp32-s3-voice-satellite"
  friendly_name: "Asystent Głosowy"
  project_name: "KRISUUUU.voice-satellite"
  project_version: "1.0.0" 
  
  # Hardware Pin Configuration / Konfiguracja Pinów Sprzętowych
  mic_bclk: GPIO15      # Microphone Bit Clock
  mic_lrclk: GPIO16     # Microphone Left/Right Clock
  mic_data: GPIO6       # Microphone Data
  
  amp_bclk: GPIO4       # Amplifier Bit Clock
  amp_lrclk: GPIO5      # Amplifier Left/Right Clock
  amp_data: GPIO11      # Amplifier Data
  
  led_pin: GPIO21       # WS2812B LED Strip
  num_leds: "12"        # Number of LEDs in ring

# ==============================================================================
# CORE CONFIGURATION / KONFIGURACJA PODSTAWOWA
# ==============================================================================

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2025.12.0
  
  on_boot:
    - priority: 600
      then:
        - script.execute: boot_sequence_smart

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_INST_CACHE_64KB: "y"
      CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE: "4096"
  flash_size: 8MB

psram:
  mode: octal
  speed: 80MHz

# ==============================================================================
# NETWORK CONFIGURATION / KONFIGURACJA SIECIOWA
# ==============================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  manual_ip:
    static_ip: 10.0.50.177
    gateway: 10.0.50.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
  ap:
    ssid: "Asystent-Recovery"
    password: !secret ap_password

api:
  encryption:
    key: !secret api_key
  
  on_client_connected:
    - logger.log: "API Connected - System Ready"
    - if:
        condition:
          not: 
            script.is_running: boot_sequence_smart
        then:
          - light.turn_on:
              id: led_ring
              brightness: 80%
              effect: "Connection Breathe"
          - delay: 3s
          - light.turn_off: led_ring
    
    - if:
        condition:
          and:
            - not: 
                micro_wake_word.is_running:
            - switch.is_off: mute_switch
        then:
          - micro_wake_word.start:

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO
  baud_rate: 115200

# ==============================================================================
# SENSORS / CZUJNIKI
# ==============================================================================

sensor:
  - platform: wifi_signal
    name: "Siła Sygnału WiFi"
    update_interval: 300s
    entity_category: diagnostic
    
  - platform: uptime
    name: "Czas Pracy"
    update_interval: 300s
    entity_category: diagnostic
    
  - platform: internal_temperature
    name: "Temperatura CPU"
    entity_category: diagnostic
    update_interval: 120s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adres IP"
      
  - platform: version
    name: "Wersja ESPHome"

# ==============================================================================
# CONTROLS / STEROWANIE
# ==============================================================================

switch:
  - platform: template
    name: "Wycisz Mikrofon"
    id: mute_switch
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: ALWAYS_OFF
    
    turn_on_action:
      - micro_wake_word.stop:
      - logger.log: "Microphone Muted"
      - light.turn_on:
          id: led_ring
          brightness: 30%
          red: 100%
          green: 0%
          blue: 0%
          effect: none
    
    turn_off_action:
      - light.turn_off: led_ring
      - micro_wake_word.start:
      - logger.log: "Microphone Unmuted"

button:
  - platform: restart
    name: "Restart Urządzenia"
    entity_category: config
    
  - platform: template
    name: "Uruchom Asystenta"
    icon: "mdi:account-voice"
    on_press:
      - voice_assistant.start:

# ==============================================================================
# BOOT SEQUENCE / SEKWENCJA STARTOWA
# ==============================================================================

script:
  - id: boot_sequence_smart
    then:
      # Boot animation / Animacja startowa
      - light.turn_on:
          id: led_ring
          brightness: 60%
          effect: "Boot Filling"
      - delay: 3600ms
      - light.turn_off: led_ring
      
      # Connection confirmation / Potwierdzenie połączenia
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: led_ring
                brightness: 80%
                effect: "Connection Breathe"
            - delay: 2000ms
            - light.turn_off: led_ring
      
      # Start wake word detection / Uruchom wykrywanie słowa aktywującego
      - if:
          condition:
            and:
              - not: 
                  micro_wake_word.is_running:
              - switch.is_off: mute_switch
          then:
            - micro_wake_word.start:

# ==============================================================================
# AUDIO HARDWARE / SPRZĘT AUDIO
# ==============================================================================

i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: ${mic_lrclk}
    i2s_bclk_pin: ${mic_bclk}
    
  - id: i2s_amp_bus
    i2s_lrclk_pin: ${amp_lrclk}
    i2s_bclk_pin: ${amp_bclk}

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: ${mic_data}
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit 
    sample_rate: 16000
    mclk_multiple: 256

speaker:
  # Physical speaker output / Fizyczne wyjście głośnika
  - platform: i2s_audio
    id: physical_speaker_output
    i2s_audio_id: i2s_amp_bus
    dac_type: external
    i2s_dout_pin: ${amp_data}
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000
    mclk_multiple: 256

  # Speaker mixer for simultaneous playback
  # Mikser głośnika dla jednoczesnego odtwarzania
  - platform: mixer
    id: main_speaker_mixer
    output_speaker: physical_speaker_output
    source_speakers:
      - id: announcement_input  # Voice assistant responses
      - id: media_input         # Media playback

media_player:
  - platform: speaker
    name: "Odtwarzacz Asystenta"
    id: voice_media_player
    announcement_pipeline:
      speaker: announcement_input
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_input
      sample_rate: 48000
      num_channels: 1

# ==============================================================================
# LED EFFECTS / EFEKTY LED
# ==============================================================================

light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "Status LED"
    pin: ${led_pin}
    num_leds: ${num_leds}
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      # Boot animation - LEDs fill progressively
      # Animacja startu - LEDy zapełniają się stopniowo
      - addressable_lambda:
          name: "Boot Filling"
          update_interval: 30ms
          lambda: |-
            static int step = 0;
            Color c_load = Color(0, 255, 200);
            it.all() = Color::BLACK;
            for (int i = 0; i <= step; i++) {
                if (i < it.size()) { it[i] = c_load; }
            }
            step++;
            if (step >= it.size()) {
               if (step > it.size() + 2) step = 0;
            }
            
      # Connection status - Green breathing effect
      # Status połączenia - Zielony efekt oddychania
      - addressable_lambda:
          name: "Connection Breathe"
          update_interval: 50ms
          lambda: |-
            float breath = sin(millis() * 0.003f);
            float brightness = (breath + 1.0f) / 2.0f;
            if (brightness < 0.1f) brightness = 0.1f;
            it.all() = Color(0, int(255 * brightness), 0);
            
      # Listening state - Blue spinning effect
      # Stan nasłuchiwania - Niebieski efekt wirujący
      - addressable_lambda:
          name: "Listening Double"
          update_interval: 60ms
          lambda: |-
            static int step = 0;
            it.all() = Color::BLACK;
            int size = it.size(); 
            int half = size / 2;
            Color c_head = Color(0, 0, 255);
            Color c_tail1 = Color(0, 0, 150);
            Color c_tail2 = Color(0, 0, 80);
            Color c_tail3 = Color(0, 0, 20);
            int h1 = step % size;
            int h2 = (step + half) % size;
            it[h1] = c_head;
            it[(h1 - 1 + size) % size] = c_tail1;
            it[(h1 - 2 + size) % size] = c_tail2;
            it[(h1 - 3 + size) % size] = c_tail3;
            it[h2] = c_head;
            it[(h2 - 1 + size) % size] = c_tail1;
            it[(h2 - 2 + size) % size] = c_tail2;
            it[(h2 - 3 + size) % size] = c_tail3;
            step++;
            if (step >= size) step = 0;
            
      # Thinking state - Blue pulsing effect
      # Stan myślenia - Niebieski efekt pulsujący
      - addressable_lambda:
         name: "Thinking Pulse"
         update_interval: 40ms
         lambda: |-
            float breath = (sin(millis() / 300.0f) + 1.0f) / 2.0f;
            float brightness = 0.2f + (0.8f * breath);
            it.all() = Color(0, 0, int(255 * brightness));
            
      # Speaking state - Purple reverse spinning
      # Stan odpowiedzi - Fioletowy efekt wirujący w odwrotnym kierunku
      - addressable_lambda:
          name: "Speaking Reverse"
          update_interval: 60ms
          lambda: |-
            static int step = 0;
            it.all() = Color::BLACK;
            int size = it.size(); 
            int half = size / 2;
            Color c_head = Color(150, 0, 255);
            Color c_tail1 = Color(100, 0, 150);
            Color c_tail2 = Color(50, 0, 80);
            Color c_tail3 = Color(10, 0, 20);
            if (step > 10000) step = 0; 
            int base = size * 100 - step;
            int h1 = base % size;
            int h2 = (base + half) % size;
            it[h1] = c_head;
            it[(h1 + 1) % size] = c_tail1;
            it[(h1 + 2) % size] = c_tail2;
            it[(h1 + 3) % size] = c_tail3;
            it[h2] = c_head;
            it[(h2 + 1) % size] = c_tail1;
            it[(h2 + 2) % size] = c_tail2;
            it[(h2 + 3) % size] = c_tail3;
            step++;

# ==============================================================================
# WAKE WORD DETECTION / WYKRYWANIE SŁOWA AKTYWUJĄCEGO
# ==============================================================================

micro_wake_word:
  id: mww
  microphone: mic_i2s
  models:
    - model: "https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/alexa.json"
      id: ww_alexa
      probability_cutoff: 0.7
      
    - model: "https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/okay_nabu.json"
      id: ww_nabu
      probability_cutoff: 0.7
      
    - model: "https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/hey_jarvis.json"
      id: ww_jarvis
      probability_cutoff: 0.7
    
  on_wake_word_detected:
    - micro_wake_word.stop:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Listening Double"
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# ==============================================================================
# VOICE ASSISTANT / ASYSTENT GŁOSOWY
# ==============================================================================

voice_assistant:
  id: va
  microphone: mic_i2s
  speaker: announcement_input
  micro_wake_word: mww
  volume_multiplier: 4.0
  
  # Listening phase / Faza nasłuchiwania
  on_listening:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Listening Double"
  
  # Processing phase / Faza przetwarzania
  on_stt_vad_end:
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Thinking Pulse"
  
  # Speaking phase / Faza odpowiedzi
  on_tts_stream_start:
    - light.turn_off: led_ring
    - delay: 50ms
    - light.turn_on:
        id: led_ring
        brightness: 100%
        effect: "Speaking Reverse"

  # End of speech / Koniec mowy
  on_tts_stream_end:
    - light.turn_off: led_ring

  # Pipeline complete / Zakończenie pipeline
  on_end:
    - delay: 1000ms
    - if:
        condition:
          and:
            - not: 
                micro_wake_word.is_running:
            - switch.is_off: mute_switch
        then:
          - micro_wake_word.start:
  
  # Error handling / Obsługa błędów
  on_error:
    - light.turn_off: led_ring
    - light.turn_on:
        id: led_ring
        brightness: 100%
        red: 100%
        green: 0%
        blue: 0%
        effect: none
    - delay: 1s
    - light.turn_off: led_ring
    - if:
        condition:
          and:
            - not: 
                micro_wake_word.is_running:
            - switch.is_off: mute_switch
        then:
          - micro_wake_word.start:

# ==============================================================================
# END OF CONFIGURATION / KONIEC KONFIGURACJI
# ==============================================================================