name: ESPHome Build & Security Test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.yaml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Pozwala uruchomić ręcznie guzikie w Actions

jobs:
  build:
    name: Validate & Compile
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Przyspiesza instalację przy kolejnych uruchomieniach

      - name: 🔧 Install ESPHome
        run: pip install esphome

      - name: 🔐 Create dummy secrets.yaml
        # Tworzymy fałszywe dane, żeby walidacja przeszła
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "CI_TEST_SSID"
          wifi_password: "CI_TEST_PASSWORD"
          api_key: "dGVzdF9hcGlfa2V5X2Zvcl9naXRodWJfYWN0aW9ucw=="
          ota_password: "ci_ota_password"
          ap_password: "ci_ap_password"
          EOF

      - name: 🔍 Validate YAML syntax
        run: esphome config voice_assistant.yaml

      - name: 🛡️ Security Check - Hardcoded Passwords
        # Sprawdza, czy nie wpisałeś hasła jawnym tekstem
        run: |
          if grep -r "password: \"" *.yaml | grep -v "!secret" | grep -v "secrets.yaml"; then
            echo "❌ CRITICAL ERROR: Found hardcoded passwords in YAML files! Use !secret instead."
            exit 1
          fi
          echo "✅ Security Check Passed: No hardcoded secrets found."

      - name: 🏗️ Compile firmware (Dry Run)
        # To najcięższy krok - sprawdza czy kod C++ się faktycznie buduje
        run: esphome compile voice_assistant.yaml

      - name: 📂 Check structure consistency
        run: |
          required_files="voice_assistant.yaml README.md README_EN.md LICENSE"
          for file in $required_files; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Required file missing: $file"
              exit 1
            fi
          done
          echo "✅ Project structure is valid."